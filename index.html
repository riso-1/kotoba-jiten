<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ことばの解釈辞典</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    /* デザイン：国語辞典（生成りの紙・墨・朱） */
    --ink: #1f1c18;
    --sub: #6d665c;
    --accent: #2b2722;
    --accent-soft: #ebe3d3;
    --red: #b23a2a;
    --line: #d8cfbf;
    --paper: #fbf8f1;
    --bg: #f5f0e5;
    --serif: "Shippori Mincho", "Yu Mincho", "YuMincho", "Hiragino Mincho ProN", "Noto Serif JP", serif;
    --sans: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", "Yu Gothic", "Meiryo", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: var(--sans);
    color: var(--ink);
    background: linear-gradient(180deg, #e9f0f2 0, var(--bg) 220px);
    min-height: 100vh;
    letter-spacing: .04em;
    line-height: 1.8;
  }
  a { color: inherit; }
  button { font: inherit; letter-spacing: inherit; cursor: pointer; }

  /* ---- header ---- */
  header.site {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 14px 28px; border-bottom: 1px solid var(--line); background: rgba(255,255,255,.75);
    backdrop-filter: blur(6px); position: sticky; top: 0; z-index: 10;
  }
  header.site .logo { font-family: var(--serif); font-size: 18px; text-decoration: none; letter-spacing: .12em; white-space: nowrap; flex-shrink: 0; }
  header.site nav { display: flex; gap: 4px; flex-wrap: wrap; }
  header.site nav a {
    text-decoration: none; font-size: 13px; padding: 4px 12px; border-radius: 999px; color: var(--sub);
  }
  header.site nav a.on, header.site nav a:hover { background: var(--accent-soft); color: var(--accent); }

  main { max-width: 1080px; margin: 0 auto; padding: 40px 28px 80px; }
  .fade { animation: fade .45s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .pill {
    display: inline-block; background: var(--accent-soft); color: var(--accent);
    font-size: 12px; font-weight: 700; padding: 2px 14px; border-radius: 999px;
  }
  .sample-note { font-size: 12px; color: var(--sub); }

  /* ---- cover ---- */
  .cover { text-align: center; padding-top: 30px; }
  .cover h1 { font-family: var(--serif); font-weight: 500; font-size: clamp(30px, 5vw, 46px); letter-spacing: .2em; margin: 12px 0 4px; }
  .cover .lead { color: var(--sub); margin: 0 0 48px; }
  .shelf {
    display: flex; justify-content: center; align-items: flex-end; gap: 14px; flex-wrap: wrap;
    padding-bottom: 14px; border-bottom: 6px solid #c9d8dc; max-width: 640px; margin: 0 auto;
  }
  .book {
    width: 86px; border: none; border-radius: 4px 6px 6px 4px; color: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: space-between;
    padding: 18px 0 14px; text-decoration: none; box-shadow: inset 6px 0 0 rgba(0,0,0,.08), 0 6px 14px rgba(40,60,70,.12);
    transition: transform .25s ease;
  }
  .book:hover { transform: translateY(-10px); }
  .book .t { writing-mode: vertical-rl; font-family: var(--serif); font-size: 24px; letter-spacing: .3em; }
  .book .n { font-size: 11px; opacity: .9; }
  .cover .links { margin-top: 44px; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }

  .btn {
    display: inline-block; text-decoration: none; border: 1px solid var(--accent); color: var(--accent);
    background: #fff; padding: 8px 22px; border-radius: 999px; font-size: 14px;
  }
  .btn.fill { background: var(--accent); color: #fff; }
  .btn:hover { opacity: .85; }

  /* ---- prose pages ---- */
  .prose { max-width: 680px; margin: 0 auto; background: var(--paper); padding: 48px 56px; border-radius: 4px; box-shadow: 0 2px 18px rgba(40,60,70,.06); }
  .prose h2 { font-family: var(--serif); font-weight: 500; font-size: 28px; letter-spacing: .2em; margin: 0 0 28px; }
  .prose h3 { font-family: var(--serif); font-weight: 500; font-size: 18px; letter-spacing: .12em; margin: 2.2em 0 .8em; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
  .prose ul { padding-left: 1.4em; }
  .prose ul li { margin-bottom: .5em; }
  .prose p { margin: 0 0 1.4em; }
  .prose ol { padding-left: 1.4em; }
  .prose li { margin-bottom: .8em; }

  /* ---- word page ---- */
  .word-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; flex-wrap: wrap; margin-bottom: 28px; }
  .word-head h2 { font-family: var(--serif); font-weight: 500; font-size: 52px; letter-spacing: .2em; margin: 0; line-height: 1.2; }
  .word-head .yomi { color: var(--sub); font-size: 14px; letter-spacing: .3em; }
  .word-head .meta { color: var(--sub); font-size: 13px; }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .toolbar button, .chip {
    border: 1px solid var(--line); background: #fff; color: var(--ink); border-radius: 999px; padding: 4px 14px; font-size: 13px; text-decoration: none;
  }
  .toolbar button:hover, .chip:hover { border-color: var(--accent); color: var(--accent); }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .word-tabs { display: flex; gap: 6px; margin-bottom: 26px; flex-wrap: wrap; }
  .word-tabs a { text-decoration: none; font-family: var(--serif); padding: 4px 16px; border-radius: 4px; border-bottom: 3px solid transparent; }
  .word-tabs a.on { border-bottom-color: currentColor; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 22px; }

  /* flip card */
  .card { perspective: 1200px; cursor: pointer; outline: none; }
  .card-inner { display: grid; transition: transform .7s cubic-bezier(.4,.2,.2,1); transform-style: preserve-3d; height: 100%; }
  .card.flipped .card-inner { transform: rotateY(180deg); }
  .face {
    grid-area: 1 / 1; backface-visibility: hidden; -webkit-backface-visibility: hidden;
    background: var(--paper); border-radius: 6px; box-shadow: 0 2px 14px rgba(40,60,70,.08);
    padding: 26px 26px 20px; display: flex; flex-direction: column; min-height: 300px; position: relative; overflow: hidden;
  }
  .face::before { content: ""; position: absolute; left: 0; top: 0; right: 0; height: 6px; background: var(--c, var(--accent)); }
  .face.back { transform: rotateY(180deg); background: #fafcfc; }
  .face .no { font-size: 11px; color: var(--sub); letter-spacing: .2em; margin-bottom: 10px; display: flex; justify-content: space-between; }
  .face .word-label { font-family: var(--serif); }
  .face blockquote { font-family: var(--serif); font-size: 19px; line-height: 1.75; margin: 0 0 14px; }
  .face .reason { font-size: 13px; color: #555f63; margin: 0 0 14px; }
  .face .image { margin-top: auto; display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--sub); border-top: 1px dashed var(--line); padding-top: 12px; }
  .face blockquote, .face .reason, .face .image span:last-child, .profile dd { white-space: pre-line; overflow-wrap: anywhere; }
  .swatch { width: 26px; height: 26px; border-radius: 50%; background: var(--c); flex: none; box-shadow: inset 0 0 0 1px rgba(0,0,0,.06); }
  .face .hint { font-size: 11px; color: #9aa7ab; text-align: right; margin-top: 10px; }
  .profile dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 6px 0 0; font-size: 14px; }
  .profile dt { color: var(--sub); font-size: 12px; padding-top: 2px; }
  .profile dd { margin: 0; }
  .profile .self { margin-top: 18px; padding: 14px; background: #fff; border-radius: 4px; text-align: center; }
  .profile .self small { display: block; color: var(--sub); font-size: 11px; }
  .profile .self span { font-family: var(--serif); font-size: 20px; }
  .mine-badge { font-size: 10px; background: #f4e6d4; color: #8a6234; padding: 0 8px; border-radius: 999px; letter-spacing: .1em; }

  /* reading mode */
  .reader { max-width: 520px; margin: 0 auto; }
  .reader .card .face { min-height: 380px; padding: 36px; }
  .reader .card blockquote { font-size: 22px; }
  .reader-nav { display: flex; align-items: center; justify-content: space-between; margin-top: 20px; color: var(--sub); font-size: 13px; }
  .reader-nav button { border: 1px solid var(--line); background: #fff; border-radius: 999px; width: 44px; height: 44px; font-size: 18px; color: var(--accent); }
  .reader-nav button:disabled { opacity: .3; cursor: default; }

  /* search */
  .search-box { display: flex; gap: 10px; margin: 18px 0; }
  .search-box input { flex: 1; font: inherit; padding: 10px 16px; border: 1px solid var(--line); border-radius: 999px; background: #fff; }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 28px; }
  .spread { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 24px; }
  .spread .bar { padding: 4px 12px; border-radius: 4px; color: #fff; font-size: 13px; font-family: var(--serif); }
  .spread .bar.zero { background: #e5ebed !important; color: #a4b0b4; }
  .empty { color: var(--sub); text-align: center; padding: 40px 0; }

  /* form */
  form .row { margin-bottom: 20px; }
  form label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 6px; }
  form label small { font-weight: 400; color: var(--sub); }
  form input[type=text], form input[type=number], form textarea, form select {
    width: 100%; font: inherit; padding: 9px 12px; border: 1px solid var(--line); border-radius: 4px; background: #fff;
  }
  form textarea { min-height: 90px; resize: vertical; }
  form .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  form fieldset { border: 1px solid var(--line); border-radius: 6px; padding: 18px 20px 4px; margin: 0 0 22px; }
  form legend { padding: 0 8px; font-size: 13px; color: var(--accent); font-weight: 700; }
  .word-pick { display: flex; gap: 8px; flex-wrap: wrap; }
  .word-pick label { font-weight: 400; margin: 0; }
  .word-pick input { display: none; }
  .word-pick span { display: inline-block; border: 1px solid var(--line); padding: 6px 18px; border-radius: 4px; font-family: var(--serif); font-size: 16px; cursor: pointer; background: #fff; }
  .word-pick input:checked + span { background: var(--accent); color: #fff; border-color: var(--accent); }
  form .choice-other { margin-top: 8px; }
  .color-row { display: flex; align-items: center; gap: 12px; }
  .color-row input[type=color] { width: 48px; height: 36px; border: 1px solid var(--line); border-radius: 4px; padding: 2px; background: #fff; }
  .mine-list { margin-top: 40px; border-top: 1px solid var(--line); padding-top: 24px; }
  .mine-list .item { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px dashed var(--line); font-size: 14px; }
  .mine-list .item button { border: none; background: none; color: #b0625a; font-size: 12px; }
  .mine-list .item-btns { display: flex; gap: 4px; flex-shrink: 0; align-items: flex-start; }
  .mine-list .item button[data-cmp] { color: var(--accent); }
  .toast { position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%); background: var(--accent); color: #fff; padding: 10px 24px; border-radius: 999px; font-size: 14px; animation: fade .3s ease; z-index: 20; }

  /* ---- analysis ---- */
  .an-head h2 { font-family: var(--serif); font-weight: 500; font-size: 30px; letter-spacing: .15em; margin: 14px 0 4px; }
  .an-block { background: var(--paper); border-radius: 6px; box-shadow: 0 2px 14px rgba(40,60,70,.06); padding: 26px 30px; margin: 0 0 26px; }
  .an-block h3 { font-family: var(--serif); font-weight: 500; font-size: 18px; letter-spacing: .12em; margin: 0 0 14px; }
  .axis-defs { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin: 0; }
  .axis-defs div { border-left: 4px solid var(--a); padding: 2px 0 2px 12px; font-size: 13px; }
  .axis-defs strong { display: block; font-size: 14px; }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; color: var(--sub); margin: 0 0 14px; }
  .legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 2px; background: var(--a); margin-right: 6px; vertical-align: -1px; }
  .stack-row { display: grid; grid-template-columns: 4.5em minmax(0, 1fr) 3.5em; align-items: center; gap: 12px; margin-bottom: 10px; text-decoration: none; }
  .stack-row .w { font-family: var(--serif); font-size: 16px; }
  .stack-row .n { font-size: 12px; color: var(--sub); text-align: right; }
  .stack { display: flex; gap: 2px; height: 30px; }
  .stack .seg { background: var(--a); color: #fff; font-size: 12px; display: flex; align-items: center; justify-content: center; white-space: nowrap; overflow: hidden; min-width: 0; position: relative; }
  .stack .seg:first-child { border-radius: 4px 0 0 4px; }
  .stack .seg:last-child { border-radius: 0 4px 4px 0; }
  .stack .seg.none { background: #e5ebed; color: #7d8a8e; }
  .stack .seg.mid { color: #2f3638; }
  .stack-row:hover .w { color: var(--accent); }
  .an-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 8px; }
  .an-table th, .an-table td { border-bottom: 1px solid var(--line); padding: 6px 8px; text-align: right; }
  .an-table th:first-child, .an-table td:first-child { text-align: left; }
  .cols3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .cols3 > div > h4 { margin: 0 0 10px; font-size: 13px; padding: 4px 10px; border-radius: 4px; background: var(--a); color: #fff; display: flex; justify-content: space-between; }
  .cols3 > div > h4.mid { color: #2f3638; }
  .mini { background: #fafcfc; border-left: 4px solid var(--c); border-radius: 0 4px 4px 0; padding: 10px 12px; margin-bottom: 10px; }
  .mini q { font-family: var(--serif); font-size: 15px; quotes: none; display: block; line-height: 1.7; }
  .mini small { display: block; color: var(--sub); font-size: 11px; margin-top: 4px; }
  .notes { white-space: pre-line; font-size: 15px; line-height: 1.9; }
  /* classify (制作者用) */
  .cl-row { display: grid; grid-template-columns: 1fr 280px; gap: 18px; padding: 16px 0; border-bottom: 1px dashed var(--line); }
  .cl-row q { font-family: var(--serif); font-size: 16px; quotes: none; display: block; }
  .cl-row .sub { font-size: 12px; color: var(--sub); margin-top: 4px; white-space: pre-line; }
  .axis-btns { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .axis-btns button { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 3px 12px; font-size: 12px; color: var(--ink); }
  .axis-btns button.on { background: var(--a); border-color: var(--a); color: #fff; }
  .axis-btns button.on.mid { color: #2f3638; }
  .cl-row input[type=text] { width: 100%; font: inherit; font-size: 12px; padding: 5px 10px; border: 1px solid var(--line); border-radius: 4px; }
  .cl-row.done > div:first-child { opacity: .6; }
  .cl-row[hidden] { display: none; }
  .dim-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 22px; }
  .dim-tabs a { text-decoration: none; border: 1px solid var(--line); background: #fff; color: var(--ink); border-radius: 999px; padding: 5px 16px; font-size: 13px; }
  .dim-tabs a.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .dim-h { font-size: 13px; color: var(--sub); margin: 18px 0 8px; font-weight: 700; }
  .dim-h:first-of-type { margin-top: 0; }
  .axis-grp small { display: block; font-size: 11px; color: var(--sub); margin-bottom: 3px; }
  .cross-ctrl { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; margin: 0 0 16px; }
  .cross-ctrl select { font: inherit; padding: 4px 8px; border: 1px solid var(--line); border-radius: 4px; background: #fff; }
  .cross-wrap { overflow-x: auto; }
  .an-table.cross th, .an-table.cross td { text-align: center; white-space: nowrap; }
  .an-table.cross th:first-child { text-align: left; }
  .an-table.cross .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; background: var(--a); margin-right: 6px; vertical-align: -1px; }
  .an-table.cross td button { width: 100%; min-width: 3em; min-height: 36px; border: 2px solid transparent; border-radius: 4px; font: inherit; color: var(--ink); background: color-mix(in srgb, var(--accent) var(--h), #fff); cursor: pointer; }
  .an-table.cross td button:disabled { cursor: default; color: var(--sub); background: #fafcfc; }
  .an-table.cross td button:not(:disabled):hover, .an-table.cross td button.on { border-color: var(--ink); }
  .an-table.cross tr.sum td, .an-table.cross tr.sum th { color: var(--sub); }
  .cross-hit { margin-top: 20px; border-top: 1px solid var(--line); padding-top: 16px; }
  .cross-hit h4 { margin: 0 0 12px; font-size: 14px; display: flex; justify-content: space-between; }
  .cross-hit h4 span { color: var(--sub); font-weight: 400; }
  .cross-w { display: block; font-family: var(--serif); font-size: 12px; margin-bottom: 2px; }
  .an-block textarea { width: 100%; min-height: 120px; font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 4px; resize: vertical; }
  @media (max-width: 760px) {
    .cols3 { grid-template-columns: 1fr; }
    .stack .seg .lb { display: none; }
    .stack-row { grid-template-columns: 3.6em minmax(0, 1fr) 2.6em; gap: 8px; }
    .cl-row { grid-template-columns: 1fr; }
    .an-block { padding: 20px 18px; }
  }

  .overview summary { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; cursor: pointer; list-style: none; }
  .overview summary::-webkit-details-marker { display: none; }
  .overview summary h3 { margin: 0; }
  .overview summary h3::before { content: "▸"; display: inline-block; width: 1.2em; color: var(--sub); transition: transform .15s ease; }
  .overview[open] summary h3::before { transform: rotate(90deg); }
  .overview summary span { font-size: 12px; color: var(--sub); }
  .overview dl { display: grid; grid-template-columns: 4em 1fr; gap: 8px 14px; margin: 16px 0 0; font-size: 13px; }
  .overview dt { color: var(--sub); }
  .overview dd { margin: 0; }
  .an-block.summary { border-top: 4px solid var(--accent); }

  /* ---- compare ---- */
  .cmp-form .row { margin-bottom: 18px; }
  .cmp-form label { display: block; font-size: 14px; font-weight: 700; margin-bottom: 8px; }
  .cmp-form .word-pick label { display: inline-block; margin: 0; font-weight: 400; }
  .cmp-form textarea { min-height: 80px; }
  .cmp-form select { width: 100%; font: inherit; font-size: 14px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 4px; background: #fff; }
  .cmp-pick span { font-family: var(--sans); font-size: 14px; padding: 6px 14px; }
  .cmp-dim { margin-bottom: 14px; }
  .cmp-dim-h { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 6px; font-size: 13px; margin-bottom: 6px; }
  .cmp-dim-h span:first-child { font-weight: 700; }
  .cmp-dim .seg[data-me] { outline: 3px solid var(--ink); outline-offset: -3px; }
  .cmp-n { font-family: var(--sans); font-size: 12px; color: var(--sub); letter-spacing: 0; margin-left: 6px; }
  .cmp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
  .cmp-card .mini { margin-bottom: 4px; }
  .cmp-card .to-person { margin-top: 0; font-size: 12px; }

  /* ---- people ---- */
  .people-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
  .person-tile { display: flex; flex-direction: column; gap: 6px; background: var(--paper); border-radius: 6px; box-shadow: 0 2px 14px rgba(40,60,70,.06); padding: 18px 18px 14px; text-decoration: none; color: var(--ink); transition: transform .15s ease; }
  .person-tile:hover { transform: translateY(-2px); }
  .person-tile .self { font-family: var(--serif); font-size: 20px; line-height: 1.4; }
  .person-head .self small { display: block; font-family: var(--sans); font-size: 11px; color: var(--sub); }
  .person-tile .who { font-size: 12px; color: var(--sub); }
  .person-tile .dots { display: flex; gap: 4px; margin-top: auto; padding-top: 8px; }
  .person-tile .dots span { width: 10px; height: 10px; border-radius: 50%; background: var(--c); }
  .person-tile .dots span.off { background: #e5ebed; }
  .person-head { background: var(--paper); border-radius: 6px; box-shadow: 0 2px 14px rgba(40,60,70,.06); padding: 26px 30px; margin: 0 0 26px; display: grid; grid-template-columns: 1fr auto; gap: 18px 30px; align-items: center; }
  .person-head h2 { font-family: var(--serif); font-weight: 500; font-size: 26px; letter-spacing: .12em; margin: 0 0 8px; }
  .person-head dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; margin: 0; font-size: 14px; }
  .person-head dt { color: var(--sub); font-size: 12px; padding-top: 2px; }
  .person-head dd { margin: 0; }
  .person-head .self { text-align: center; padding: 14px 22px; border: 1px solid var(--line); border-radius: 4px; font-family: var(--serif); font-size: 22px; }
  .person-entry { background: var(--paper); border-radius: 6px; box-shadow: 0 2px 14px rgba(40,60,70,.06); border-left: 6px solid var(--c); padding: 22px 28px; margin: 0 0 18px; }
  .person-entry h3 { margin: 0 0 8px; font-family: var(--serif); font-weight: 500; font-size: 15px; letter-spacing: .12em; }
  .person-entry h3 a { color: var(--c); text-decoration: none; }

/* =========================================================
   CSV 取り込み（Googleフォーム／Excel の書き出しを想定）
   ========================================================= */
function decodeFile(buf) {
  try { return new TextDecoder('utf-8', { fatal: true }).decode(buf); }
  catch { return new TextDecoder('shift_jis').decode(buf); } // Excel で保存した CSV
}
function parseCSV(text) {
  text = text.replace(/^﻿/, '');
  const first = text.split(/\r?\n/, 1)[0];
  const d = (first.split('\t').length > first.split(',').length) ? '\t' : ',';
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === d) { row.push(f); f = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; }
    else f += c;
  }
  if (f || row.length) { row.push(f); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim()));
}
// 見出しの文字から、どの列が何の回答かを判定する
function mapColumns(header) {
  // words   : アンケート形式（1行に5つの言葉すべての回答がある）の列
  // wordCol : 投稿フォーム形式（「言葉をえらぶ」列で言葉を1つ選ぶ）のときの、その列
  // generic : 投稿フォーム形式の、言葉名を含まない解釈・理由・イメージなどの列
  // approve  : 「掲載OK」チェック列（回答シートをそのまま読んだ場合の安全策。TRUE の行だけ使う）
  const m = { profile: {}, words: {}, generic: {}, wordCol: -1, consent: -1, approve: -1, unused: [] };
  WORDS.forEach(w => m.words[w.id] = {});
  let prevWord = null; // 直前の列の言葉（「そのように考える理由」のように言葉名がない列に使う）
  header.forEach((h, i) => {
    const s = h.replace(/\s/g, '');
    if (/掲載OK|承認/i.test(s)) { m.approve = i; prevWord = null; return; }
    if (/掲載/.test(s)) { m.consent = i; prevWord = null; return; }
    if (/言葉をえらぶ|言葉を選/.test(s)) { m.wordCol = i; prevWord = null; return; }
    // 「普通」のようにかぎ括弧つきを優先し、「自由に書いて」などの取り違えを防ぐ
    let w = WORDS.find(w => s.includes('「' + w.label + '」')) || WORDS.find(w => s.includes(w.label));
    if (!w && prevWord && /理由/.test(s)) w = prevWord;
    if (w && /自由に(書|記入|お書き)/.test(s) && !s.includes('「' + w.label + '」')) w = null;
    prevWord = null;
    if (w && !/表す言葉|大切|難しかった/.test(s)) {
      prevWord = w;
      const t = m.words[w.id];
      if (/色コード|カラーコード/.test(s)) t.color ??= i;
      else if (/キーワード|タグ|分類/.test(s)) t.tags ??= i;
      else if (/色|形|風景|音|手触り|イメージ/.test(s)) t.image ??= i;
      else if (/理由|経験|場面/.test(s)) t.reason ??= i;
      else if (/とは|どのような|解釈/.test(s)) t.text ??= i;
      else m.unused.push(h);
      return;
    }
    if (/ペンネーム|ニックネーム/.test(s)) m.profile.name ??= i;
    else if (/年齢|年代/.test(s)) m.profile.age ??= i;
    else if (/性別/.test(s)) m.profile.gender ??= i;
    else if (/立場|仕事|職業/.test(s)) m.profile.role ??= i;
    else if (/関心/.test(s)) m.profile.interest ??= i;
    else if (/表す言葉/.test(s)) m.profile.self ??= i;
    else if (/色コード|カラーコード/.test(s)) m.generic.color ??= i;
    else if (/キーワード|タグ/.test(s)) m.generic.tags ??= i;
    else if (/色|形|風景|音|手触り|イメージ/.test(s)) m.generic.image ??= i;
    else if (/理由|場面/.test(s)) m.generic.reason ??= i;
    else if (/とは|どのような/.test(s)) m.generic.text ??= i;
    else m.unused.push(h);
  });
  if (m.wordCol < 0) { // アンケート形式では generic 列は使わない
    for (const k in m.generic) m.unused.push(header[m.generic[k]]);
    m.generic = {};
  }
  return m;
}
// 1人分の回答（1行）を、5つの言葉それぞれの解釈カードに分ける
function rowsToEntries(rows) {
  const [header = [], ...body] = rows;
  const m = mapColumns(header);
  const entries = []; let skipped = 0;
  body.forEach(r => {
    const g = i => (i == null || i < 0) ? '' : String(r[i] ?? '').trim();
    if (m.approve >= 0 && !/^(TRUE|はい|OK|1|✓)$/i.test(g(m.approve))) { skipped++; return; }
    if (m.consent >= 0 && /不可|いいえ|しない|NG/i.test(g(m.consent))) { skipped++; return; }
    const profile = {}; for (const k in m.profile) profile[k] = g(m.profile[k]);
    const push = (w, c) => {
      const text = g(c.text);
      if (!w || !text) return;
      let color = g(c.color); if (color && !color.startsWith('#')) color = '#' + color;
      if (!/^#[0-9a-f]{6}$/i.test(color)) color = undefined;
      entries.push({ word: w.id, text, reason: g(c.reason), image: g(c.image), color,
        tags: g(c.tags).split(/[、,，・\s]+/).filter(Boolean), profile });
    };
    if (m.wordCol >= 0) { // 投稿フォーム形式：1行＝1枚
      const v = g(m.wordCol);
      push(WORDS.find(w => w.label === v || w.id === v), m.generic);
    } else {              // アンケート形式：1行＝5枚
      WORDS.forEach(w => push(w, m.words[w.id]));
    }
  });
  return { entries, map: m, rowCount: body.length, skipped };
}

  while ((m = COLOR_RE.exec(t)) && out.length < 4) {
    let hex = COLOR_WORDS.find(([w]) => w === m[2])[1];
    if (/薄い|淡い|ペール|やわらかな/.test(m[1] || '')) hex = mixHex(hex, '#ffffff', .45);
    if (/濃い|深い/.test(m[1] || '')) hex = mixHex(hex, '#000000', .25);
    if (!out.some(o => o.hex === hex)) out.push({ hex, name: (m[1] || '') + m[2] });
  }
  return out;
}
// 丸：投稿者が色を選んでいればその色、なければ文章の色の名前から
const imageSwatches = e => { const c = chosenColor(e);
  if (c) return `<span class="swatch" style="--c:${c}" title="投稿者が選んだイメージの色"></span>`;

function cardHTML(e, no, showWord) {

      <div class="who"><span class="nm">${esc(shown(p.name) || 'ペンネームなし')}</span>${who ? `<span>${esc(who)}</span>` : ''}<span class="open">考えた人</span></div>

}
function bindCards(root = app) {
  root.querySelectorAll('.card').forEach(c => {
    const flip = () => c.classList.toggle('flipped');
    c.addEventListener('click', ev => { if (!ev.target.closest('a')) flip(); });
    c.addEventListener('keydown', ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); flip(); } });
  });
}

function viewWord(id, mode) {

  </section>`;
  const body = document.getElementById('body');

  if (!entries.length) {
    body.innerHTML = `<p class="empty">「${w.label}」の解釈は、まだありません。</p>`;
    const tb = app.querySelector('.toolbar'); if (tb) tb.querySelectorAll('button').forEach(b => b.remove());
    return;
  }

  if (mode === 'read') {
    let i = 0;
    const draw = () => {
      body.innerHTML = `<div class="reader">${cardHTML(entries[i], i + 1)}
        <div class="reader-nav"><button id="prev" ${i === 0 ? 'disabled' : ''}>‹</button>
        <span>${i + 1} / ${entries.length}　（解釈を押すと、考えた人がひらきます）</span>
        <button id="next" ${i === entries.length - 1 ? 'disabled' : ''}>›</button></div></div>`;
      bindCards(body);
      body.querySelector('#prev').onclick = () => { if (i > 0) { i--; draw(); } };
      body.querySelector('#next').onclick = () => { if (i < entries.length - 1) { i++; draw(); } };
    };
    document.onkeydown = ev => {
      if (ev.key === 'ArrowLeft' && i > 0) { i--; draw(); }
      if (ev.key === 'ArrowRight' && i < entries.length - 1) { i++; draw(); }
    };
    draw();
    return;
  }

  const draw = list => { body.innerHTML = `<div class="grid">${list.map((e, k) => cardHTML(e, entries.indexOf(e) + 1)).join('')}</div>`; bindCards(body); };

    cards.forEach((c, k) => setTimeout(() => c.classList.toggle('flipped', toBack), k * 60));
  };

  if (!hits.length) { res.innerHTML = `<p class="empty">「${esc(q)}」を含む解釈は、まだありません。<br><a href="#/add">あなたの解釈をくわえる</a></p>`; return; }

  bindCards(res);
}

/* =========================================================
   人から読む：同じ回答者の解釈を並べる
   アンケートの回答だけを、プロフィール（ペンネーム・年代・性別・立場・関心・今の自分を表す言葉）が
   すべて同じものを同じ人としてまとめる。番号は data.js に出てくる順。
   ========================================================= */
const shown = v => v && v !== '回答しない' ? v : '';
const personSig = e => { const p = e.profile || {};
  return JSON.stringify(['name', 'age', 'gender', 'role', 'interest', 'self'].map(k => String(p[k] ?? '').trim())); };
let peopleCache = null;
function people() {
  const src = allEntries().filter(e => !e.mine && !e.posted);
  if (peopleCache && peopleCache.src === src.length) return peopleCache.list;
  const map = new Map();
  src.forEach(e => { const k = personSig(e); if (!map.has(k)) map.set(k, { no: map.size + 1, sig: k, profile: e.profile || {}, entries: [] }); map.get(k).entries.push(e); });
  const list = [...map.values()];
  peopleCache = { src: src.length, list };
  return list;
}
const personOf = e => (e.mine || e.posted) ? null : people().find(x => x.sig === personSig(e)) || null;
const personName = p => shown(p.name) || 'ペンネームなし';
const personWho = p => [p.age && (p.age + (/^\d+$/.test(p.age) ? '歳' : '')), p.role].map(shown).filter(Boolean).join('・');

function viewPeople() {
  const list = people();
  app.innerHTML = `
  <section class="fade">
    <div class="an-head"><span class="pill">人から読む</span>
      <h2>ひとりの、5つの解釈</h2>
      <p class="sample-note">アンケートに答えてくれた${list.length}人が、5つの言葉をそれぞれどう解釈したかを、人ごとに並べました。言葉ごとに読むときとは違って、その人の考え方の筋道や、言葉どうしのつながりが見えてきます。大きな文字は、その人が答えた「今の自分を表す言葉」です。</p>
    </div>
    ${list.length ? `<div class="people-grid">${list.map(x => { const p = x.profile;
      return `<a class="person-tile" href="#/people/${x.no}">
        <span class="self">${esc(shown(p.self) || '―')}</span>
        <span class="who">${esc(personName(p))}${personWho(p) ? '　' + esc(personWho(p)) : ''}</span>
        <span class="dots">${WORDS.map(w => `<span class="${x.entries.some(e => e.word === w.id) ? '' : 'off'}" style="--c:${w.color}" title="${w.label}"></span>`).join('')}</span>
      </a>`; }).join('')}</div>` : '<p class="empty">まだ回答はありません。</p>'}
  </section>`;
}

function viewPerson(no) {
  const list = people();
  const i = list.findIndex(x => String(x.no) === String(no));
  if (i < 0) { viewPeople(); return; }
  const x = list[i]; const p = x.profile;
  const row = (k, v) => shown(v) ? `<dt>${k}</dt><dd>${esc(v)}</dd>` : '';
  const go = n => { if (list[n]) location.hash = '#/people/' + list[n].no; };
  app.innerHTML = `
  <section class="fade" style="max-width:800px;margin:0 auto">
    <p class="sample-note" style="margin:0 0 14px"><a href="#/people">← 人から読む</a></p>
    <div class="person-head">
      <div>
        <h2>${esc(personName(p))}</h2>
        <dl>${row('年齢', p.age && (p.age + (/^\d+$/.test(p.age) ? '歳' : '')))}${row('性別', p.gender)}${row('立場', p.role)}${row('いま関心のあること', p.interest)}</dl>
      </div>
      ${shown(p.self) ? `<div class="self"><small>今の自分を表す言葉</small>${esc(p.self)}</div>` : ''}
    </div>
    ${WORDS.map(w => { const e = x.entries.find(v => v.word === w.id);
      return e ? `<div class="person-entry" style="--c:${esc(e.color || w.color)}">
        <h3><a href="#/word/${w.id}">「${w.label}」</a></h3>
        <blockquote>${esc(e.text)}</blockquote>
        ${e.reason ? `<p class="reason">${esc(e.reason)}</p>` : ''}
        ${e.image ? `<div class="image">イメージ：${imageSwatches(e)}${esc(e.image)}</div>` : ''}
      </div>` : `<div class="person-entry none">「${w.label}」には回答がありません。</div>`; }).join('')}
    <div class="reader-nav">
      <button id="prev" ${i === 0 ? 'disabled' : ''} aria-label="前の人">‹</button>
      <span>${i + 1} / ${list.length}</span>
      <button id="next" ${i === list.length - 1 ? 'disabled' : ''} aria-label="次の人">›</button>
    </div>
  </section>`;
  document.getElementById('prev').onclick = () => go(i - 1);
  document.getElementById('next').onclick = () => go(i + 1);
  document.onkeydown = ev => { if (ev.key === 'ArrowLeft') go(i - 1); if (ev.key === 'ArrowRight') go(i + 1); };
}

/* =========================================================
   くらべる：読者が自分の解釈を、分析の3つの観点で位置づけて、回答者の解釈とくらべる
   入力した内容は保存も送信もしない（「辞書にくわえる」を押したときだけ、
   投稿画面に下書きとして引き継ぐ）
   ========================================================= */
const COMPARE_Q = {
  center:   { q: 'あなたの解釈は、何を中心にしていますか', opts: ['自分の気持ちや感覚', '自分と人との関係', '他の人や社会'] },
  concrete: { q: 'どのように表しましたか', opts: ['具体的な場面や物', '具体と抽象の両方', '考え方や状態'] },
  tone:     { q: 'その言葉を、どう感じていますか', opts: ['良いもの・大切なもの', 'どちらとも言えない', '良くない面もある'] },
};
const DRAFT_KEY = 'kotoba-compare-draft';
let refreshComparePicker = null;
const bigrams = t => { const c = String(t).replace(/[\s、。，．,.!?！？「」『』（）()・…ー〜~]/g, ''); const b = new Set();
  for (let i = 0; i < c.length - 1; i++) b.add(c.slice(i, i + 2)); if (c.length === 1) b.add(c); return b; };
const textSim = (x, y) => { const a = bigrams(x), b = bigrams(y); if (!a.size || !b.size) return 0;
  let n = 0; a.forEach(v => { if (b.has(v)) n++; }); return n / (a.size + b.size - n); };

function viewCompare(preWord) {
  const a = loadAnalysis();
  let draft = {}; try { draft = JSON.parse(sessionStorage.getItem(DRAFT_KEY)) || {}; sessionStorage.removeItem(DRAFT_KEY); } catch {}
  const w0 = wordById(preWord) || wordById(draft.word) || WORDS[0];
  app.innerHTML = `
  <section class="fade" style="max-width:800px;margin:0 auto">
    <div class="an-head"><span class="pill">くらべる</span>
      <h2>あなたの解釈とくらべる</h2>
      <p class="sample-note">あなたの解釈を書いて、3つの問いに答えると、投稿された解釈のなかで、あなたと近い解釈・遠い解釈が見つかります。分析ページと同じ観点を使っています。<br>
      この画面に入力した内容は、保存も送信もされません。</p>
    </div>
    <form id="cf" class="an-block cmp-form">
      <div class="row"><label>言葉をえらぶ</label>
        <div class="word-pick">${WORDS.map(w => `<label><input type="radio" name="word" value="${w.id}" ${w.id === w0.id ? 'checked' : ''}><span>${w.label}</span></label>`).join('')}</div></div>
      <div class="row" id="cpickRow"><label for="cpick">投稿された解釈から選ぶ <small>（任意）</small></label>
        <select id="cpick"></select>
        <p class="sample-note" style="margin:6px 0 0">解釈を投稿したことのある方は、自分の解釈を選んでくらべられます。選ぶと、分析での分類が下の問いに入ります（変えることもできます）。</p></div>
      <div class="row"><label for="ctext">あなたにとって、その言葉とはどのようなものですか？ <small>（任意）</small></label>
        <textarea id="ctext" placeholder="書くと、ことばの近い解釈も探します">${esc(draft.text || '')}</textarea></div>
      ${DIMS.map(d => `<div class="row"><label>${esc(COMPARE_Q[d.id].q)}</label>
        <div class="word-pick cmp-pick">${d.cats.map((c, i) => `<label><input type="radio" name="${d.id}" value="${c.id}" required><span>${esc(COMPARE_Q[d.id].opts[i])}</span></label>`).join('')}</div></div>`).join('')}
      <button class="btn fill" type="submit">くらべる</button>
    </form>
    <div id="cres"></div>
  </section>`;

  const form = document.getElementById('cf');
  // 投稿された解釈から選べる（「言葉をえらぶ」で選んでいる言葉の解釈だけを並べる）
  // このブラウザから投稿した解釈を先頭に、そのあとに辞書に載っている解釈
  const short = t => { t = String(t).replace(/\s+/g, ' ').trim(); return t.length > 26 ? t.slice(0, 26) + '…' : t; };
  const curWord = () => form.querySelector('input[name=word]:checked').value;
  const fillPicker = () => {
    const sel = document.getElementById('cpick'); if (!sel) return;
    const keep = sel.value && pickList[+sel.value];
    const word = curWord();
    const mine = loadMine().filter(validEntry).filter(e => e.word === word);
    const others = [...analysisEntries(), ...remoteEntries.filter(validEntry)]
      .filter(e => e.word === word && !mine.some(m => sameEntry(m, e)));
    pickList = [...mine, ...others];
    const opt = (e, k, mark) => { const nm = shown((e.profile || {}).name);
      return `<option value="${k}" ${keep === e ? 'selected' : ''}>${esc(short(e.text))}${mark ? '（あなたの投稿）' : nm ? `（${esc(nm)}）` : ''}</option>`; };
    sel.innerHTML = `<option value="">選ばずに書く</option>${pickList.map((e, k) => opt(e, k, k < mine.length)).join('')}`;
    if (keep && !pickList.includes(keep)) picked = null;
  };
  let pickList = [];
  let picked = null;
  fillPicker();
  refreshComparePicker = fillPicker;
  form.querySelectorAll('input[name=word]').forEach(r => r.onchange = () => { picked = null; fillPicker(); });
  document.getElementById('cpick').onchange = ev => {
    const e = pickList[+ev.target.value]; picked = ev.target.value === '' ? null : e || null;
    if (!picked) return;
    document.getElementById('ctext').value = e.text;
    // 分析で分類している解釈なら、その分類を問いの答えに入れる
    DIMS.forEach(d => { const c = !e.mine ? catOf(e, a, d) : null;
      form.querySelectorAll(`input[name=${d.id}]`).forEach(x => { x.checked = !!c && x.value === c; }); });
  };
  form.onsubmit = ev => {
    ev.preventDefault();
    const word = form.querySelector('input[name=word]:checked').value; const w = wordById(word);
    const text = document.getElementById('ctext').value.trim();
    const mine = Object.fromEntries(DIMS.map(d => [d.id, form.querySelector(`input[name=${d.id}]:checked`).value]));
    // 選んだ解釈そのものは、くらべる相手から外す
    const list = compareEntries(a).filter(e => e.word === word && DIMS.every(d => catOf(e, a, d))
      && !(picked && picked.word === word && entryKey(picked) === entryKey(e)));
    const res = document.getElementById('cres');
    if (!list.length) { res.innerHTML = `<p class="empty">「${w.label}」はまだ分類されていないため、くらべられません。</p>`; return; }
    const idx = (d, id) => d.cats.findIndex(c => c.id === id);
    const dist = e => DIMS.reduce((s, d) => s + Math.abs(idx(d, catOf(e, a, d)) - idx(d, mine[d.id])), 0);
    const same = e => DIMS.filter(d => catOf(e, a, d) === mine[d.id]).length;
    const exact = list.filter(e => same(e) === DIMS.length);
    const near = exact.length ? exact : list.filter(e => same(e) === DIMS.length - 1);
    const maxD = Math.max(...list.map(dist));
    const far = maxD > 0 ? shuffle(list.filter(e => dist(e) === maxD)).slice(0, 3) : [];
    const sim = text ? list.map(e => [e, textSim(text, e.text)]).filter(([, v]) => v >= 0.08).sort((x, y) => y[1] - x[1]).slice(0, 3).map(([e]) => e) : [];
    const card = e => { const ps = personOf(e);
      return `<div class="cmp-card">${miniCard(e)}${ps ? `<a class="to-person" href="#/people/${ps.no}">この人の5つの解釈を読む →</a>` : ''}</div>`; };
    res.innerHTML = `
    <div class="an-block">
      <h3>「${w.label}」のなかの、あなたの位置</h3>
      ${text ? `<div class="mini" style="--c:${w.color};margin-bottom:18px"><q>${esc(text)}</q><small>あなたの解釈</small></div>` : ''}
      ${DIMS.map(d => { const c = d.cats.find(x => x.id === mine[d.id]); const n = list.filter(e => catOf(e, a, d) === c.id).length;
        return `<div class="cmp-dim"><div class="cmp-dim-h"><span>${esc(d.label)}</span><span>あなたと同じ「${esc(c.label)}」は ${list.length}件中 <strong>${n}件</strong></span></div>
          ${stackBar(list, a, d).replace(`title="${esc(c.label)}：`, `data-me="1" title="${esc(c.label)}：`)}</div>`; }).join('')}
      <p class="sample-note" style="margin:10px 0 0">枠で囲んだところが、あなたの答えです。</p>
    </div>
    <div class="an-block">
      <h3>あなたと近い解釈 <small class="cmp-n">${exact.length ? '3つの観点がすべて同じ' : '3つの観点のうち2つが同じ'}・${near.length}件</small></h3>
      ${near.length ? `<div class="cmp-grid">${shuffle(near).slice(0, 6).map(card).join('')}</div>${near.length > 6 ? `<p class="sample-note">ほかに${near.length - 6}件あります。もう一度「くらべる」を押すと入れ替わります。</p>` : ''}` : '<p class="sample-note">近い解釈は見つかりませんでした。あなたの解釈は、ここに集まったどの解釈とも違う場所にあります。</p>'}
      <p class="sample-note" style="margin:6px 0 0">観点が同じでも、書かれていることはきっと違います。どこが重なり、どこが違うかを読んでみてください。</p>
    </div>
    ${far.length ? `<div class="an-block">
      <h3>あなたから遠い解釈</h3>
      <div class="cmp-grid">${far.map(card).join('')}</div>
      <p class="sample-note" style="margin:6px 0 0">同じ「${w.label}」という言葉を、この人たちはなぜこう捉えたのでしょう。その人のページで、ほかの言葉の解釈も読んでみてください。</p>
    </div>` : ''}
    ${sim.length ? `<div class="an-block">
      <h3>ことばが近い解釈</h3>
      <div class="cmp-grid">${sim.map(card).join('')}</div>
      <p class="sample-note" style="margin:6px 0 0">あなたが書いた文と、似た表現を使っている解釈です。</p>
    </div>` : ''}
    <p style="text-align:center">
      ${text ? `<button class="btn fill" id="toAdd" type="button">この解釈を辞書にくわえる</button>` : ''}
      <a class="btn" href="#/word/${w.id}">「${w.label}」の解釈をすべて読む</a>
    </p>`;
    const toAdd = document.getElementById('toAdd');
    if (toAdd) toAdd.onclick = () => { try { sessionStorage.setItem(DRAFT_KEY, JSON.stringify({ word, text })); } catch {} location.hash = '#/add?word=' + word; };
    res.scrollIntoView({ behavior: 'smooth', block: 'start' });
  };
}

        <li>言葉ごとの列：見出しに「普通」「自由」などの言葉を入れ、あわせて「とは」（解釈）・「理由」（理由）・「色／形／風景／音／手触り」（イメージ）・「色コード」・「キーワード」のいずれかを含めます。</li>
        <li>プロフィール：「年齢」「性別」「立場」「関心」「表す言葉」を含む列。</li>
        <li>「掲載」を含む列の回答が「不可／いいえ／しない」の人は取り込みません。</li>
      </ul>
    </details>
  </article>`;

  const clear = document.getElementById('clear');
  if (clear) clear.onclick = () => { saveImported(null); toast('取り込みを解除しました'); viewImport(); };

  document.getElementById('csv').onchange = async ev => {
    const file = ev.target.files[0]; if (!file) return;
    const out = document.getElementById('result');
    let r;
    try { r = rowsToEntries(parseCSV(decodeFile(await file.arrayBuffer()))); }
    catch (err) { out.innerHTML = `<p class="empty">読み込めませんでした：${esc(err.message)}</p>`; return; }
    const m = r.map;
    const found = WORDS.map(w => {
      const cols = Object.keys(m.words[w.id]).map(k => ITEM_LABEL[k]);
      const n = r.entries.filter(e => e.word === w.id).length;
      return `<li>「${w.label}」${n}件　<small style="color:var(--sub)">${cols.length ? cols.join('・') : '列が見つかりません'}</small></li>`;
    }).join('');
    const prof = Object.keys(m.profile).map(k => PROFILE_LABEL[k]).join('・') || 'なし';
    out.innerHTML = `
      <fieldset style="border:1px solid var(--line);border-radius:6px;padding:16px 20px;margin:16px 0">
        <legend style="padding:0 8px;font-size:13px;color:var(--accent);font-weight:700">読み込み結果：${esc(file.name)}</legend>
        <p style="margin:0 0 8px;font-size:14px">回答 ${r.rowCount}人 → カード <strong>${r.entries.length}件</strong>${r.skipped ? `（掲載不可の ${r.skipped}人は除外）` : ''}</p>
        <ul style="font-size:14px;margin:0 0 8px">${found}</ul>
        <p style="font-size:13px;margin:0 0 8px">プロフィールの列：${prof}${m.consent >= 0 ? '・掲載の可否' : ''}</p>
        ${m.unused.length ? `<p style="font-size:12px;color:var(--sub);margin:0">使わなかった列：${m.unused.map(esc).join('、')}</p>` : ''}
      </fieldset>
      ${r.entries.length ? `<p><button class="btn fill" id="use" type="button">このブラウザで表示を確認する</button>　<button class="btn" id="dl" type="button">data.js を書き出す</button></p>
      <p class="sample-note">「表示を確認する」はこのブラウザだけに反映されます。公開するときは data.js を書き出して index.html と同じフォルダに置き、取り込みを解除してください。</p>`
      : `<p class="empty">カードにできる回答が見つかりませんでした。見出しの決まりを確認してください。</p>`}`;
    const use = document.getElementById('use');
    if (use) use.onclick = () => { saveImported(r.entries); toast(`${r.entries.length}件を取り込みました`); location.hash = '#/'; };
    const dl = document.getElementById('dl');
    if (dl) dl.onclick = () => downloadDataJs(r.entries);
  };
}

/* =========================================================
   分析：解釈の「軸」による分類
   ---------------------------------------------------------
   DIMS  : 分類の観点（軸）。観点ごとに cats（分類の項目）を持つ。
           label・desc（分類の基準）は自由に書き換えてよい。
           項目の行を消せば、その分類は「未分類」扱いになる（データは消えない）。
           観点を増やすときは、id が重ならないように行を足す。
   分類と考察は「分類作業」画面（#/analysis/classify）で入力する。
   入力内容はまずこのブラウザに保存され、「analysis.js を書き出す」で
   ファイルにして index.html と同じフォルダに置くと、誰が見ても反映される。

   analysis.js の中身
     axis     : 「自分と他者」の分類（最初の観点。以前のファイルと同じ形）
     dims     : それ以外の観点の分類 { 観点id: { 解釈の鍵: 項目id } }
     notes    : 言葉ごとの考察 { 言葉id: 文 }（観点に分けず、言葉ごとに1つ）
     summary  : 分析全体のまとめ（文）
     memo     : 分類メモ（非公開）
   ========================================================= */
// 調査の概要（分析ページの最初に表示）。回答者数・内訳はデータから自動で数える
const SURVEY = {
  method: 'Google フォームによるオンラインアンケート',
  period: '2026年10月23日〜11月12日',
  classify: '分類は制作者が、観点ごとの基準に沿って行い、ひとつの解釈を観点ごとにひとつの項目に分けました。「具体と抽象」「肯定と否定」は、解釈の本文（理由やイメージの欄を除く）をもとに判断しています。',
  caution: '回答者の多くは20代の女性・大学生です。この結果は、ここに集まった回答の傾向であり、世の中一般の傾向を示すものではありません。',
};
const DIMS = [
  { id: 'center', label: '自分と他者',
    intro: 'その言葉が<strong>自分</strong>を中心に語られているか、<strong>他者や社会</strong>を中心に語られているか。',
    cats: [
      { id: 'self',  label: '自分が軸',       short: '自分',       color: '#c4673c',
        desc: '自分の感覚・気持ち・体・選択を中心に語られている解釈' },
      { id: 'both',  label: '自分と他者のあいだ', short: 'あいだ',  color: '#a3a6a8', mid: true,
        desc: '自分と他者（人・社会）との関係そのものが語られている解釈' },
      { id: 'other', label: '他者・社会が軸', short: '他者・社会', color: '#2f7bb0',
        desc: '他者の存在や、社会・みんなの基準を中心に語られている解釈' },
    ] },
  { id: 'concrete', label: '具体と抽象',
    intro: 'その言葉が<strong>具体的な場面や物</strong>で語られているか、<strong>抽象的な考え方や状態</strong>として語られているか。',
    cats: [
      { id: 'concrete', label: '具体的',         short: '具体', color: '#3f8f6b',
        desc: '具体的な場面・物・人・行動を挙げて語られている解釈' },
      { id: 'mixed',    label: '具体と抽象の両方', short: '両方', color: '#a3a6a8', mid: true,
        desc: '具体的な例と、抽象的な言い換えの両方を含む解釈' },
      { id: 'abstract', label: '抽象的',         short: '抽象', color: '#8a5a9e',
        desc: '状態・考え方・定義として、言い換えの形で語られている解釈' },
    ] },
  { id: 'tone', label: '肯定と否定',

    cats: [
      { id: 'positive', label: '肯定的', short: '肯定', color: '#d08a2e',
        desc: 'その言葉を良いもの・望ましいもの・大切なものとして語っている解釈' },
      { id: 'neutral',  label: '中立',   short: '中立', color: '#a3a6a8', mid: true,
        desc: '良し悪しの評価を含まず、意味や状態を説明している解釈' },
      { id: 'negative', label: '否定的', short: '否定', color: '#4d5f8a',
        desc: 'その言葉に違和感・窮屈さ・難しさなど、否定的な面を見ている解釈' },
    ] },
];
const dimById = id => DIMS.find(d => d.id === id);
const ANALYSIS_KEY = 'kotoba-jiten-analysis-v1';
const emptyAnalysis = () => ({ axis: {}, dims: {}, memo: {}, notes: {}, summary: '' });
const normAnalysis = o => { const a = { ...emptyAnalysis(), ...o };
  ['axis', 'dims', 'memo', 'notes'].forEach(k => { if (!a[k] || typeof a[k] !== 'object') a[k] = {}; });
  if (typeof a.summary !== 'string') a.summary = '';
  return a; };
const fileAnalysis = () => {
  const f = window.KOTOBA_ANALYSIS;
  return f ? normAnalysis(JSON.parse(JSON.stringify(f))) : emptyAnalysis();
};
let memoryAnalysis = null;
const analysisSource = () => {
  try { if (localStorage.getItem(ANALYSIS_KEY)) return 'local'; } catch { if (memoryAnalysis) return 'local'; }
  return window.KOTOBA_ANALYSIS ? 'file' : 'none';
};
const loadAnalysis = () => {
  try { const v = localStorage.getItem(ANALYSIS_KEY); if (v) return normAnalysis(JSON.parse(v)); }
  catch { if (memoryAnalysis) return memoryAnalysis; }
  return fileAnalysis();
};
const saveAnalysis = a => { memoryAnalysis = a; try { localStorage.setItem(ANALYSIS_KEY, JSON.stringify(a)); } catch {} };
const clearAnalysis = () => { memoryAnalysis = null; try { localStorage.removeItem(ANALYSIS_KEY); } catch {} };
// 解釈を見分ける鍵（言葉＋本文＋回答者の年齢・性別・立場）。データの並びが変わっても分類がずれないようにする
// 同じ言葉に同じ文の回答が複数ある場合（例：「優しさ」の「想像」）に備えて、プロフィールの一部も鍵に含める
const entryKey = e => { const p = e.profile || {};
  return [e.word, String(e.text).trim(), p.age, p.gender, p.role].map(v => String(v ?? '').trim()).join('|'); };
// 分析の対象はアンケートの回答だけ（投稿フォームから届いた解釈と、読者がこのブラウザで足した解釈は含めない）
const analysisEntries = () => allEntries().filter(e => !e.mine && !e.posted);
// 投稿フォームから届いて掲載された解釈（分類作業の画面で分類できる。分類すると「くらべる」の相手になるが、分析の集計には入れない）
const postedEntries = () => allEntries().filter(e => e.posted && !e.mine);
// 「くらべる」の相手：アンケートの回答と、3つの観点すべてを分類済みの投稿
const compareEntries = a => [...analysisEntries(), ...postedEntries().filter(e => DIMS.every(d => catOf(e, a, d)))];
// 観点ごとの分類の置き場所（最初の観点は以前の analysis.js と同じ axis を使う）
const dimMap = (a, id) => id === DIMS[0].id ? a.axis : (a.dims[id] = a.dims[id] || {});
const catOf = (e, a, d) => { const id = dimMap(a, d.id)[entryKey(e)]; return d.cats.some(c => c.id === id) ? id : null; };
const NONE_CAT = { id: null, label: '未分類', short: '未分類', color: '#e5ebed', none: true };

function downloadAnalysisJs(a) {
  const js = `// ことばの解釈辞典 分類・考察データ（${new Date().toLocaleString('ja-JP')} 書き出し）\n// このファイルを index.html と同じフォルダに置くと、分析ページに表示されます。\nwindow.KOTOBA_ANALYSIS = ${JSON.stringify(a, null, 2)};\n`;
  const el = document.createElement('a');
  el.href = URL.createObjectURL(new Blob([js], { type: 'text/javascript' }));
  el.download = 'analysis.js'; el.click();
}

const segStyle = c => `--a:${c.color}`;
function stackBar(list, a, d) {
  const total = list.length || 1;
  const parts = d.cats.map(c => ({ c, n: list.filter(e => catOf(e, a, d) === c.id).length }));
  const none = list.length - parts.reduce((s, p) => s + p.n, 0);
  const seg = (n, cls, style, label, title) => n ? `<div class="seg ${cls}" style="flex:${n} 1 0;${style}" title="${esc(title)}">${n / total >= .12 ? `<span class="lb">${esc(label)}&nbsp;</span>${n}` : ''}</div>` : '';
  return `<div class="stack">${parts.map(p => seg(p.n, p.c.mid ? 'mid' : '', segStyle(p.c), p.c.short, `${p.c.label}：${p.n}件（${Math.round(p.n / total * 100)}%）`)).join('')}${seg(none, 'none', '', '未分類', `未分類：${none}件`)}</div>`;
}
const catDefs = d => `<div class="axis-defs">${d.cats.map(c => `<div style="${segStyle(c)}"><strong>${esc(c.label)}</strong>${esc(c.desc)}</div>`).join('')}</div>`;
const miniCard = e => { const p = e.profile || {}; const w = wordById(e.word) || WORDS[0];
  const who = [p.age && (p.age + (/^\d+$/.test(p.age) ? '歳' : '')), p.role].filter(Boolean).join('・');
  return `<div class="mini" style="--c:${esc(e.color || w.color)}"><q>${esc(e.text)}</q>${who ? `<small>${esc(who)}</small>` : ''}</div>`; };

function viewAnalysis(params) {
  const a = loadAnalysis();
  const all = analysisEntries();
  const isCross = params.get('d') === 'cross';
  const d = isCross ? null : (dimById(params.get('d')) || DIMS[0]);
  const any = DIMS.some(x => all.some(e => catOf(e, a, x)));
  const w = wordById(params.get('w')) || WORDS[0];
  const dimTabs = [...DIMS.map(x => [x.id, x.label]), ['cross', '掛け合わせ']]
    .map(([id, l]) => `<a href="#/analysis?d=${id}&w=${w.id}" class="${(isCross ? 'cross' : d.id) === id ? 'on' : ''}">${esc(l)}</a>`).join('');

  let body = '';
  if (!any) body = `<p class="empty">分類はまだありません。<br><a href="#/analysis/classify">分類作業の画面</a>で、解釈を分類してください。</p>`;
  else if (d) {
    const list = all.filter(e => e.word === w.id);
    const unclassified = list.filter(e => !catOf(e, a, d)).length;
    const note = a.notes[w.id];
    const tabs = WORDS.map(x => `<a href="#/analysis?d=${d.id}&w=${x.id}" class="${x.id === w.id ? 'on' : ''}" style="color:${x.color}">${x.label}</a>`).join('');
    body = all.some(e => catOf(e, a, d)) ? `
    <div class="an-block">
      <h3>分類の基準</h3>

      ${catDefs(d)}
    </div>

    <div class="an-block">
      <h3>5つの言葉の比較</h3>
      <div class="legend">${d.cats.map(c => `<span style="${segStyle(c)}">${esc(c.label)}</span>`).join('')}<span style="--a:#e5ebed">未分類</span></div>
      ${WORDS.map(x => { const l = all.filter(e => e.word === x.id);
        return `<a class="stack-row" href="#/analysis?d=${d.id}&w=${x.id}"><span class="w" style="color:${x.color}">${x.label}</span>${stackBar(l, a, d)}<span class="n">${l.length}件</span></a>`; }).join('')}
      <details style="margin-top:14px;font-size:13px"><summary style="color:var(--sub)">表で見る</summary>
        <table class="an-table"><thead><tr><th>言葉</th>${d.cats.map(c => `<th>${esc(c.short)}</th>`).join('')}<th>未分類</th><th>計</th></tr></thead><tbody>
        ${WORDS.map(x => { const l = all.filter(e => e.word === x.id);
          const c = d.cats.map(ct => l.filter(e => catOf(e, a, d) === ct.id).length);
          return `<tr><td>${x.label}</td>${c.map(n => `<td>${n}</td>`).join('')}<td>${l.length - c.reduce((s, n) => s + n, 0)}</td><td>${l.length}</td></tr>`; }).join('')}
        </tbody></table>
      </details>
      <p class="sample-note" style="margin:12px 0 0">※ 回答数が少ない言葉では、わずかな件数の差が大きな割合の差に見えます。件数もあわせてご覧ください。</p>
    </div>

    <div class="word-tabs">${tabs}</div>
    <div class="an-block">
      <h3 style="color:${w.color}">「${w.label}」の解釈の分布</h3>
      ${note ? `<div class="notes" style="margin-bottom:22px">${esc(note)}</div>` : ''}
      <div class="cols3">${d.cats.map(c => { const l = list.filter(e => catOf(e, a, d) === c.id);
        return `<div style="${segStyle(c)}"><h4 class="${c.mid ? 'mid' : ''}"><span>${esc(c.label)}</span><span>${l.length}</span></h4>${l.map(miniCard).join('') || '<p class="sample-note">該当なし</p>'}</div>`; }).join('')}</div>
      ${unclassified ? `<p class="sample-note" style="margin:8px 0 0">未分類 ${unclassified}件</p>` : ''}
    </div>`
    : `<div class="an-block"><h3>分類の基準</h3><p class="sample-note" style="margin:0 0 14px">${d.intro}</p>${catDefs(d)}</div>
       <p class="empty">「${esc(d.label)}」の分類はまだありません。<br><a href="#/analysis/classify?w=${w.id}">分類作業の画面</a>で、解釈を分類してください。</p>`;
  } else body = `<div id="cross"></div>`;

  // 調査の概要：回答者の内訳はプロフィールから数える（「回答しない」は最後）
  const ppl = people();
  const tally = k => { const m = new Map();
    ppl.forEach(x => { const v = String(x.profile[k] || '回答しない').trim() || '回答しない'; m.set(v, (m.get(v) || 0) + 1); });
    return [...m].sort((a, b) => (a[0] === '回答しない') - (b[0] === '回答しない') || (k === 'age' ? a[0].localeCompare(b[0], 'ja', { numeric: true }) : b[1] - a[1]))
      .map(([v, n]) => `${esc(v)} ${n}人`).join('、'); };
  const overview = `
    <details class="an-block overview">
      <summary><h3>調査の概要</h3><span>${ppl.length}人・${all.length}件の解釈</span></summary>

        <dt>期間</dt><dd>${esc(SURVEY.period)}</dd>
        <dt>回答</dt><dd>${ppl.length}人（5つの言葉の解釈 ${all.length}件）</dd>
        <dt>年代</dt><dd>${tally('age')}</dd>
        <dt>性別</dt><dd>${tally('gender')}</dd>
        <dt>立場</dt><dd>${tally('role')}</dd>
        <dt>分類</dt><dd>${esc(SURVEY.classify)}</dd>
      </dl>
      <p class="sample-note" style="margin:12px 0 0">※ ${esc(SURVEY.caution)}</p>
    </details>`;
  const summary = a.summary && a.summary.trim() ? `
    <div class="an-block summary"><h3>まとめ</h3><div class="notes">${esc(a.summary)}</div></div>` : '';

  app.innerHTML = `
  <section class="fade">
    <div class="an-head"><span class="pill">分析</span>
      <h2>解釈の「軸」をくらべる</h2>
      <p class="sample-note">アンケートで集まった解釈を、${DIMS.length}つの観点で分類しました。同じ言葉でも、どこに軸を置くかは人によって異なります。「掛け合わせ」では、2つの観点を組み合わせて見ることができます。</p>
    </div>
    ${overview}
    ${any ? `<div class="dim-tabs">${dimTabs}</div>` : ''}
    ${body}
    ${summary}
    <p class="sample-note" style="text-align:center;margin-top:30px"><a href="#/analysis/classify?w=${w.id}">分類作業（制作者用）</a></p>
  </section>`;
  if (any && isCross) crossView(all, a, params);
}

// 掛け合わせ：2つの観点のクロス集計。表のマスを押すと、そこに入る解釈が下に並ぶ
function crossView(all, a, params) {
  const box = document.getElementById('cross');
  let rd = dimById(params.get('r')) || DIMS[0];
  let cd = dimById(params.get('c')) || DIMS.find(x => x !== rd);
  if (cd === rd) cd = DIMS.find(x => x !== rd);
  let ws = wordById(params.get('ws')) ? params.get('ws') : 'all';
  let pick = null;
  const sync = () => { const q = new URLSearchParams({ d: 'cross', r: rd.id, c: cd.id });
    q.set('ws', ws);
    history.replaceState(null, '', '#/analysis?' + q.toString()); };
  const render = () => {
    const list = ws === 'all' ? all : all.filter(e => e.word === ws);
    const wd = wordById(ws);
    const inCell = (r, c) => list.filter(e => catOf(e, a, rd) === r.id && catOf(e, a, cd) === c.id);
    const rows = [...rd.cats, NONE_CAT].filter(r => !r.none || list.some(e => !catOf(e, a, rd)));
    const cols = [...cd.cats, NONE_CAT].filter(c => !c.none || list.some(e => !catOf(e, a, cd)));
    const max = Math.max(1, ...rd.cats.flatMap(r => cd.cats.map(c => inCell(r, c).length)));
    const opt = (sel, v) => DIMS.map(x => `<option value="${x.id}" ${x === v ? 'selected' : ''}>${esc(x.label)}</option>`).join('');
    const note = ws === 'all' ? '' : a.notes[ws];
    const hit = pick && inCell(pick.r, pick.c);
    box.innerHTML = `
    <div class="an-block">
      <h3>2つの観点を掛け合わせる</h3>
      <div class="cross-ctrl">
        <label>縦 <select id="xr">${opt('r', rd)}</select></label>
        <label>横 <select id="xc">${opt('c', cd)}</select></label>
        <label>言葉 <select id="xw"><option value="all">5つの言葉すべて</option>${WORDS.map(x => `<option value="${x.id}" ${x.id === ws ? 'selected' : ''}>${x.label}</option>`).join('')}</select></label>
      </div>
      ${note ? `<div class="notes" style="margin:0 0 18px">${esc(note)}</div>` : ''}
      <div class="cross-wrap"><table class="an-table cross">
        <thead><tr><th><small>${esc(rd.label)} ＼ ${esc(cd.label)}</small></th>${cols.map(c => `<th style="${segStyle(c)}"><span class="sw"></span>${esc(c.short)}</th>`).join('')}<th>計</th></tr></thead>
        <tbody>${rows.map(r => { const n = cols.map(c => inCell(r, c).length);
          return `<tr><th style="${segStyle(r)}"><span class="sw"></span>${esc(r.short)}</th>${cols.map((c, i) => {
            const on = pick && pick.r === r && pick.c === c;
            const heat = r.none || c.none ? 0 : Math.round(n[i] / max * 60);
            return `<td><button type="button" class="${on ? 'on' : ''}" data-r="${rows.indexOf(r)}" data-c="${i}" style="--h:${heat}%" ${n[i] ? '' : 'disabled'} title="${esc(`${r.label} × ${c.label}：${n[i]}件`)}">${n[i]}</button></td>`; }).join('')}<td>${n.reduce((s, x) => s + x, 0)}</td></tr>`; }).join('')}
        <tr class="sum"><th>計</th>${cols.map(c => `<td>${list.filter(e => catOf(e, a, cd) === c.id).length}</td>`).join('')}<td>${list.length}</td></tr>
        </tbody></table></div>
      <p class="sample-note" style="margin:12px 0 0">数字のマスを押すと、そこに入る解釈が下に並びます。色の濃さは件数の多さを表します。</p>
      ${hit ? `<div class="cross-hit"><h4>${esc(pick.r.label)} × ${esc(pick.c.label)}${wd ? `（${wd.label}）` : ''} <span>${hit.length}件</span></h4>
        ${hit.map(e => `${ws === 'all' ? `<small class="cross-w" style="color:${(wordById(e.word) || WORDS[0]).color}">${(wordById(e.word) || WORDS[0]).label}</small>` : ''}${miniCard(e)}`).join('')}</div>` : ''}
    </div>`;
    box.querySelector('#xr').onchange = ev => { rd = dimById(ev.target.value); if (cd === rd) cd = DIMS.find(x => x !== rd); pick = null; sync(); render(); };
    box.querySelector('#xc').onchange = ev => { cd = dimById(ev.target.value); if (cd === rd) rd = DIMS.find(x => x !== cd); pick = null; sync(); render(); };
    box.querySelector('#xw').onchange = ev => { ws = ev.target.value; pick = null; sync(); render(); };
    box.querySelectorAll('.cross td button').forEach(b => b.onclick = () => {
      const r = rows[+b.dataset.r], c = cols[+b.dataset.c];
      pick = pick && pick.r === r && pick.c === c ? null : { r, c }; render();
      if (pick) box.querySelector('.cross-hit').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    });
  };
  sync(); render();
}

function viewClassify(wid) {
  const w = wordById(wid) || WORDS[0];
  let a = loadAnalysis();
  const all = analysisEntries();
  const list = all.filter(e => e.word === w.id);
  const posts = postedEntries().filter(e => e.word === w.id);
  const allPosts = postedEntries();
  let onlyTodo = false; try { onlyTodo = sessionStorage.getItem('kotoba-only-todo') === '1'; } catch {}
  const src = analysisSource();
  const done = e => DIMS.every(d => catOf(e, a, d));
  const count = (l, d) => l.filter(e => d ? catOf(e, a, d) : done(e)).length;
  const tabs = WORDS.map(x => { const l = all.filter(e => e.word === x.id); const pl = allPosts.filter(e => e.word === x.id);
    const todoPosts = pl.length - count(pl);
    return `<a href="#/analysis/classify?w=${x.id}" class="${x.id === w.id ? 'on' : ''}" style="color:${x.color}">${x.label} <small style="font-family:var(--sans);font-size:11px;color:var(--sub)">${count(l)}/${l.length}${todoPosts ? `・<span style="color:#b0625a">投稿 未分類${todoPosts}</span>` : ''}</small></a>`; }).join('');
  const btns = (e, d) => { const cur = catOf(e, a, d);
    return d.cats.map(c => `<button type="button" data-cat="${c.id}" class="${cur === c.id ? 'on' : ''} ${c.mid ? 'mid' : ''}" style="${segStyle(c)}">${esc(c.short)}</button>`).join(''); };
  const row = (e, i, pre = 'No.') => { const k = entryKey(e); const p = e.profile || {};
    const who = [p.age && (p.age + (/^\d+$/.test(p.age) ? '歳' : '')), p.gender, p.role].filter(Boolean).join('・');
    return `<div class="cl-row ${done(e) ? 'done' : ''}" data-k="${esc(k)}" ${onlyTodo && done(e) ? 'hidden' : ''}>
      <div><small style="color:var(--sub);font-size:11px">${pre}${String(i + 1).padStart(2, '0')}</small><q>${esc(e.text)}</q>
        <div class="sub">${[e.reason, e.image && ('イメージ：' + e.image), who].filter(Boolean).map(esc).join('\n')}</div></div>
      <div>${DIMS.map(d => `<div class="axis-grp" data-dim="${d.id}"><small>${esc(d.label)}</small><div class="axis-btns">${btns(e, d)}</div></div>`).join('')}
        <input type="text" data-memo placeholder="分類メモ（任意・非公開）" value="${esc(a.memo[k] || '')}"></div>
    </div>`; };
  const progText = () => DIMS.map(d => `${d.label} ${count(list, d)}/${list.length}`).join('　');

  app.innerHTML = `
  <section class="fade" style="max-width:940px;margin:0 auto">
    <div class="an-head"><span class="pill">分類作業（制作者用）</span>
      <h2>解釈を分類する</h2>
      <p class="sample-note">1件ずつ読んで、観点ごとに項目を選んでください。もう一度押すと取り消せます。入力はすぐにこのブラウザへ保存されます。<br>
      いま使っている分類データ：<strong>${{ local: 'このブラウザで作業中のデータ', file: '同じフォルダの analysis.js', none: 'まだありません' }[src]}</strong></p>
    </div>
    <div class="an-block">
      <h3>分類の基準</h3>
      ${DIMS.map(d => `<h4 class="dim-h">${esc(d.label)}</h4>${catDefs(d)}`).join('')}
    </div>
    <div class="word-tabs">${tabs}</div>
    <div class="an-block">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
        <h3 style="margin:0;color:${w.color}">「${w.label}」 <small id="prog" style="font-family:var(--sans);font-size:12px;color:var(--sub)">${progText()}</small></h3>
        <label style="font-size:13px"><input type="checkbox" id="todo" ${onlyTodo ? 'checked' : ''}> 未分類が残っているものだけ表示</label>
      </div>
      ${list.length ? list.map((e, i) => row(e, i)).join('') : '<p class="empty">この言葉の解釈はまだありません。</p>'}
    </div>
    <div class="an-block">
      <h3 style="margin:0 0 4px">「${w.label}」の投稿 <small id="progP" style="font-family:var(--sans);font-size:12px;color:var(--sub)">${posts.length ? `${count(posts)} / ${posts.length} 件 分類済み` : ''}</small></h3>
      <p class="sample-note" style="margin:0 0 6px">投稿フォームから届き、掲載した解釈です。3つの観点すべてを分類すると「くらべる」の比べる相手に入ります。分析ページの集計には入りません。</p>
      ${posts.length ? posts.map((e, i) => row(e, i, '投稿 ')).join('') : '<p class="empty" style="padding:16px 0">この言葉の投稿はまだありません。</p>'}
    </div>
    <div class="an-block">
      <h3>「${w.label}」の考察 <small style="font-family:var(--sans);font-size:12px;color:var(--sub)">（分析ページで、どの観点を見ているときも「${w.label}」の欄に表示されます）</small></h3>
      <textarea id="note" placeholder="分類してみて気づいた共通点・相違点・矛盾などを書いてください">${esc(a.notes[w.id] || '')}</textarea>
    </div>
    <div class="an-block">
      <h3>分析全体のまとめ <small style="font-family:var(--sans);font-size:12px;color:var(--sub)">（分析ページのいちばん下に、どの観点を見ているときも表示されます）</small></h3>
      <textarea id="summary" style="min-height:200px" placeholder="5つの言葉と3つの観点を通して見えてきたこと、言葉の解釈の違いから他者を知ることについて考えたことを書いてください">${esc(a.summary || '')}</textarea>
    </div>
    <p style="text-align:center">
      <button class="btn fill" id="exp" type="button">analysis.js を書き出す</button>
      <a class="btn" href="#/analysis?w=${w.id}">分析ページで確認する</a>
      ${src === 'local' ? `<button class="btn" id="reset" type="button">作業データを消す</button>` : ''}
    </p>
    <p class="sample-note" style="text-align:center">作業データはこのブラウザだけのものです。公開するときは analysis.js を書き出して index.html と同じフォルダに置き、「作業データを消す」を押してください。</p>
  </section>`;

  const prog = () => { document.getElementById('prog').textContent = progText();
    const pp = document.getElementById('progP'); if (pp && posts.length) pp.textContent = `${count(posts)} / ${posts.length} 件 分類済み`; };
  app.querySelectorAll('.cl-row').forEach(r => {
    const k = r.dataset.k; const e = [...list, ...posts].find(x => entryKey(x) === k);
    // ボタンの外枠に1回だけ付ける（中身を描き直しても押せる）
    r.querySelectorAll('.axis-grp').forEach(g => {
      const d = dimById(g.dataset.dim); const box = g.querySelector('.axis-btns');
      box.onclick = ev => {
        const b = ev.target.closest('[data-cat]'); if (!b) return;
        a = loadAnalysis(); const m = dimMap(a, d.id);
        if (m[k] === b.dataset.cat) delete m[k]; else m[k] = b.dataset.cat;
        saveAnalysis(a);
        box.innerHTML = btns(e, d);
        r.classList.toggle('done', done(e));
        prog();
      };
    });
    r.querySelector('[data-memo]').oninput = ev => {
      a = loadAnalysis(); const v = ev.target.value.trim();
      if (v) a.memo[k] = v; else delete a.memo[k];
      saveAnalysis(a);
    };
  });
  document.getElementById('todo').onchange = ev => { try { sessionStorage.setItem('kotoba-only-todo', ev.target.checked ? '1' : '0'); } catch {} viewClassify(w.id); };
  document.getElementById('note').oninput = ev => {
    a = loadAnalysis(); const v = ev.target.value;
    if (v.trim()) a.notes[w.id] = v; else delete a.notes[w.id];
    saveAnalysis(a);
  };
  document.getElementById('summary').oninput = ev => {
    a = loadAnalysis(); a.summary = ev.target.value.trim() ? ev.target.value : '';
    saveAnalysis(a);
  };
  document.getElementById('exp').onclick = () => downloadAnalysisJs(loadAnalysis());
  const rs = document.getElementById('reset');
  if (rs) rs.onclick = () => {
    if (!confirm('このブラウザの作業データを消して、analysis.js の内容に戻します。書き出していない分類は失われます。よろしいですか？')) return;
    clearAnalysis(); toast('作業データを消しました'); viewClassify(w.id);
  };
}

/* =========================================================
   router
   ========================================================= */
function route() {
  document.onkeydown = null;
  refreshComparePicker = null;
  const [path, query] = location.hash.replace(/^#/, '').split('?');
  const params = new URLSearchParams(query || '');
  const seg = (path || '/').split('/').filter(Boolean);
  const r = seg[0] || '';
  document.querySelectorAll('#nav a').forEach(a => a.classList.toggle('on', a.dataset.r === r));
  if (r === 'intro') viewIntro();
  else if (r === 'word') viewWord(seg[1], seg[2]);
  else if (r === 'search') viewSearch(params.get('q') || '');
  else if (r === 'add') viewAdd(params.get('word'));
  else if (r === 'voices') viewVoices();
  else if (r === 'compare') viewCompare(params.get('word'));
  else if (r === 'people') seg[1] ? viewPerson(seg[1]) : viewPeople();
  else if (r === 'end') viewEnd();
  else if (r === 'about') viewAbout();
  else if (r === 'import') viewImport();
  else if (r === 'analysis') seg[1] === 'classify' ? viewClassify(params.get('w')) : viewAnalysis(params);
  else viewCover();
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
route();
// 掲載済みの投稿を読み込めたら描き直す（入力中のフォームは消さない）
loadRemote().then(ok => {
  if (!ok || !remoteEntries.length) return;
  if (/^#\/compare/.test(location.hash)) { if (refreshComparePicker) refreshComparePicker(); }
  else if (/^#\/analysis\/classify/.test(location.hash)) {
    // 分類は押すたびに保存しているので描き直してよい。文字を入力中のときだけは描き直さない
    const f = document.activeElement; if (!(f && /^(INPUT|TEXTAREA)$/.test(f.tagName) && f.type !== 'checkbox')) route();
  }
  else if (!/^#\/add/.test(location.hash)) route();
});
</script>
